[project]
name = "manim-master-skill"
version = "0.1.0"
description = "A production-grade Claude Skill for Manim Community Edition animations."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [
  { name = "Madhur Mishra" }
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = [
  "media",
  ".venv",
  "venv",
  "__pycache__"
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501"]
