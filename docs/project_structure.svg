<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 950 260" width="100%" height="100%">
  <defs>
    <linearGradient id="panel-grad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#1e293b" />
      <stop offset="100%" stop-color="#0f172a" />
    </linearGradient>
    <linearGradient id="accent-purple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7" />
      <stop offset="100%" stop-color="#6366f1" />
    </linearGradient>

    <style>
      .file-row {
        transition: all 0.3s ease;
        cursor: pointer;
      }
      .file-row:hover {
        fill: #1e293b;
      }
      .text-title {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 13px;
        font-weight: 700;
        fill: #ffffff;
      }
      .text-file {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 11.5px;
        font-weight: 600;
        fill: #cbd5e1;
      }
      .text-comment {
        font-family: 'Inter', system-ui, -apple-system, sans-serif;
        font-size: 9.5px;
        fill: #64748b;
      }
      .arrow {
        stroke-dasharray: 5, 5;
        animation: march 1s linear infinite;
      }
      @keyframes march {
        to {
          stroke-dashoffset: -10;
        }
      }
    </style>
  </defs>

  <!-- Background -->
  <rect width="950" height="260" rx="16" fill="#0b1020" />

  <!-- Left Box: Claude Prompt -->
  <g transform="translate(25, 30)">
    <rect width="300" height="200" rx="12" fill="url(#panel-grad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="300" height="40" rx="12" fill="#1e293b" />
    <text x="20" y="24" class="text-title">📥 Input Prompt</text>
    
    <rect x="15" y="55" width="270" height="125" rx="8" fill="#090d16" />
    <text x="25" y="78" font-family="'Fira Code', monospace" font-size="10.5" fill="#3b82f6">Prompt:</text>
    <text x="25" y="100" font-family="'Fira Code', monospace" font-size="9.5" fill="#e2e8f0">Create a Manim animation explaining</text>
    <text x="25" y="116" font-family="'Fira Code', monospace" font-size="9.5" fill="#a855f7">why the derivative of sin(x) is cos(x).</text>
    <text x="25" y="132" font-family="'Fira Code', monospace" font-size="9.5" fill="#e2e8f0">Use unit circle visual...</text>
    <text x="25" y="152" font-family="'Fira Code', monospace" font-size="9.5" fill="#64748b"># (16:9, subtitles enabled)</text>
  </g>

  <!-- Flow Arrow -->
  <g transform="translate(340, 110)">
    <path d="M 0,20 L 70,20" stroke="url(#accent-purple)" stroke-width="3" stroke-linecap="round" fill="none" class="arrow" />
    <polygon points="70,14 82,20 70,26" fill="#8b5cf6" />
    <text x="35" y="5" font-family="'Inter', sans-serif" font-size="9" font-weight="700" fill="#8b5cf6" text-anchor="middle">Generates Workspace</text>
  </g>

  <!-- Right Box: Project Workspace -->
  <g transform="translate(435, 30)">
    <rect width="490" height="200" rx="12" fill="url(#panel-grad)" stroke="#1e293b" stroke-width="1.5" />
    <rect x="0" y="0" width="490" height="40" rx="12" fill="#1e293b" />
    <text x="20" y="24" class="text-title">📂 Generated Workspace</text>
    
    <!-- Files Explorer Mock -->
    <g transform="translate(20, 55)">
      <!-- project root folder -->
      <g>
        <text x="0" y="18" font-size="16">📁</text>
        <text x="24" y="15" class="text-file" font-weight="700" fill="#ffffff">project-name/</text>
      </g>

      <!-- plan.md -->
      <g class="file-row" transform="translate(20, 24)">
        <rect x="-5" y="-12" width="440" height="22" rx="4" fill="transparent" />
        <text x="0" y="5" font-size="14">📝</text>
        <text x="22" y="3" class="text-file">plan.md</text>
        <text x="120" y="2" class="text-comment">— Scene-by-scene script planning document</text>
      </g>

      <!-- script.py -->
      <g class="file-row" transform="translate(20, 46)">
        <rect x="-5" y="-12" width="440" height="22" rx="4" fill="transparent" />
        <text x="0" y="5" font-size="14">🐍</text>
        <text x="22" y="3" class="text-file" fill="#3b82f6" font-weight="700">script.py</text>
        <text x="120" y="2" class="text-comment">— Production-ready Manim Community Edition code</text>
      </g>

      <!-- manim.cfg -->
      <g class="file-row" transform="translate(20, 68)">
        <rect x="-5" y="-12" width="440" height="22" rx="4" fill="transparent" />
        <text x="0" y="5" font-size="14">⚙️</text>
        <text x="22" y="3" class="text-file">manim.cfg</text>
        <text x="120" y="2" class="text-comment">— Quality, resolution, and background settings</text>
      </g>

      <!-- concat.txt -->
      <g class="file-row" transform="translate(20, 90)">
        <rect x="-5" y="-12" width="440" height="22" rx="4" fill="transparent" />
        <text x="0" y="5" font-size="14">📋</text>
        <text x="22" y="3" class="text-file">concat.txt</text>
        <text x="120" y="2" class="text-comment">— Segment list for stitching rendered scenes</text>
      </g>

      <!-- final.mp4 -->
      <g class="file-row" transform="translate(20, 112)">
        <rect x="-5" y="-12" width="440" height="22" rx="4" fill="transparent" />
        <text x="0" y="5" font-size="14">🎬</text>
        <text x="22" y="3" class="text-file" fill="#10b981" font-weight="700">final.mp4</text>
        <text x="120" y="2" class="text-comment">— High-quality video export ready to publish</text>
      </g>
    </g>
  </g>
</svg>
